# Diagnostic: runs the page-builder self-test ON the hosting server and prints the result.
# "export-page" prints the PUBLISHED (already public) version of one page, gzip+base64, to reproduce problems.
name: Server self-test
on:
  workflow_dispatch:
    inputs:
      action:
        description: "selftest, export-page or import"
        default: selftest
      slug:
        description: "page slug (export-page) or site URL (import)"
        default: ""
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Run on the live server
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          ACTION: ${{ inputs.action }}
          SLUG: ${{ inputs.slug }}
        run: |
          curl -sS --max-time 290 -X POST "${SITE_URL%/}/_deploy" -H "X-Deploy-Token: $DEPLOY_TOKEN" -H "Accept: application/json" \
            --data-urlencode "action=$ACTION" --data-urlencode "slug=$SLUG" -o result.json
          if [ "$ACTION" = "export-page" ]; then echo "EXPORT:$(gzip -9c result.json | base64 -w0)"; else python3 -m json.tool result.json; fi
