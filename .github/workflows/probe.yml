# Diagnostic: runs the page-builder self-test ON the hosting server and prints the result.
name: Server self-test
on: workflow_dispatch
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Run self-test on the live server
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl -sS -X POST "${SITE_URL%/}/_deploy" -H "X-Deploy-Token: $DEPLOY_TOKEN" -H "Accept: application/json" -d "action=selftest" | python3 -m json.tool
