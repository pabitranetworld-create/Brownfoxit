# ------------------------------------------------------------------
# Auto-deploy: every push to "main" goes live on the cPanel hosting.
#
#   0. runs the full test (test.yml) – nothing is deployed if it fails
#   1. installs the PHP libraries (vendor/) on GitHub's server
#   2. uploads only the changed files to the hosting over FTP
#   3. calls https://your-site/_deploy so the site runs new database
#      migrations and refreshes its caches
#
# One-time setup: GitHub repo → Settings → Secrets and variables → Actions
#   FTP_SERVER      ftp.brownfoxit.com
#   FTP_USERNAME    the cPanel FTP account
#   FTP_PASSWORD    its password
#   FTP_SERVER_DIR  folder of the site on the hosting, ending with "/"
#                   (FTP account root, e.g. "/public_html/" or "/brownfoxit/")
#   SITE_URL        https://www.brownfoxit.com
#   DEPLOY_TOKEN    shown on the installer's last screen (also DEPLOY_TOKEN in the server's .env)
# Optional:
#   FTP_PROTOCOL    "ftps" (default) or "ftp" if your host has no FTPS
# ------------------------------------------------------------------
name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Never deploy code that fails the full installer/home page test.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check that deploy secrets are set
        id: secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_SERVER_DIR" ]; then
            echo "::warning::FTP secrets are not set yet, skipping deploy. See README (Auto-deploy)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Set up PHP
        if: steps.secrets.outputs.ready == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, intl, fileinfo, curl, dom
          tools: composer:v2
          coverage: none

      - name: Cache Composer packages
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: composer-

      - name: Install PHP libraries (vendor)
        if: steps.secrets.outputs.ready == 'true'
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Check PHP syntax
        if: steps.secrets.outputs.ready == 'true'
        run: find app bootstrap config database routes installer public -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Upload changed files (FTP)
        if: steps.secrets.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          security: loose
          timeout: 120000
          # Never touch files that belong to the live server
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/node_modules/**
            .env
            .env.backup
            .env.production
            storage/**
            bootstrap/cache/*.php
            public/uploads/**
            public/storage
            tests/**

      - name: Run migrations and refresh caches on the server
        if: steps.secrets.outputs.ready == 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "::warning::SITE_URL or DEPLOY_TOKEN not set, skipped the deploy hook (run migrations manually)."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "${SITE_URL%/}/_deploy" \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            -H "Accept: application/json" \
            -d "commit=$GITHUB_SHA"
          echo
          echo "Live: $SITE_URL"
