# ------------------------------------------------------------------
# Builds "brownfoxit-install.zip": the whole site INCLUDING vendor/,
# ready to upload to any cPanel, extract, and open in the browser
# (the web installer starts automatically).
#
# Built automatically on every push to main. Always-current download link:
#   https://github.com/<owner>/<repo>/releases/latest/download/brownfoxit-install.zip
# (GitHub → repo page → Releases → "Latest install zip")
# Pushing a tag like v1.0.0 also makes a numbered release.
# ------------------------------------------------------------------
name: Build install zip

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: release-zip
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, intl, fileinfo, curl, dom
          tools: composer:v2
          coverage: none

      - name: Install PHP libraries (vendor)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Make the zip
        run: |
          rm -f .env bootstrap/cache/*.php storage/installed.json
          zip -qr brownfoxit-install.zip . \
            -x ".git/*" ".github/*" "node_modules/*" "tests/*" ".env" "*.DS_Store"
          ls -lh brownfoxit-install.zip

      - uses: actions/upload-artifact@v4
        with:
          name: brownfoxit-install
          path: brownfoxit-install.zip
          retention-days: 30

      - name: Publish as "Latest install zip" (direct download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete install-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create install-latest brownfoxit-install.zip \
            --target "$GITHUB_SHA" --latest \
            --title "Latest install zip" \
            --notes "সর্বশেষ কোড দিয়ে বানানো install zip (vendor সহ)। নামিয়ে cPanel-এ extract করুন, তারপর ডোমেইন খুলুন। Commit: $GITHUB_SHA"

      - name: Attach to a numbered release (tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: brownfoxit-install.zip
